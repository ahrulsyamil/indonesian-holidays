version: 2
updates:
  # Bun dependencies — grouped to reduce PR noise
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates batched into one PR per week
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Ignore major upgrades that require migration work before adoption
    ignore:
      # Biome 2 requires `biome migrate` on biome.json
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      # Zod 4 has breaking API changes (error.issues vs error.errors, etc.)
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # Vitest 4 has breaking pool API changes (poolOptions removed)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # vitest-pool-workers 0.15+ requires Vitest 4 — ignore until we migrate
      - dependency-name: "@cloudflare/vitest-pool-workers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions — keep CI/CD actions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
